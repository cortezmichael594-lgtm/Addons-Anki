[project]
name = "addons-anki"
version = "1.0.0"
description = "Taller para que Claude Code cree y mantenga complementos de Anki a medida"
requires-python = ">=3.13"

# Herramientas de revisión. Las versiones están fijadas en requirements-dev.txt y la de Anki en
# requirements-anki.txt. Los complementos no tienen dependencias: solo usan lo que trae Anki.

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["herramientas", "pruebas", "complementos"]
# docs/ lleva el ejemplo de referencia, protegido por la cerradura; paquetes/, los .ankiaddon.
extend-exclude = ["docs", "paquetes", "entregas"]

[tool.ruff.format]
# El código de los complementos ya entregados no se reformatea: cada cambio de forma sería un
# cambio sin probar dentro de Anki.
exclude = ["complementos/**"]

[tool.ruff.lint]
# E/F/W: errores y estilo básico · I: orden de imports · B: fallos típicos
# UP: sintaxis moderna · SIM: simplificaciones · BLE: «except» que lo traga todo
# RUF: reglas propias de ruff (sin las de caracteres raros, que chocan con el español)
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# En los complementos solo cuentan los errores graves (sintaxis y nombres sin definir o sin usar).
"complementos/**" = ["E4", "E7", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
# check_web define «flag» dentro del bucle y la usa solo en esa misma vuelta: B023 no aplica.
"herramientas/empaquetar.py" = ["B023"]

[tool.mypy]
# Herramientas del taller. Los complementos los comprueba empaquetar.py, con la API real de Anki
# y como en Windows (--platform win32), que es donde se ejecutan.
python_version = "3.13"
files = ["herramientas", "pruebas/herramientas"]
mypy_path = ["herramientas"]

[[tool.mypy.overrides]]
module = ["comprobar", "empaquetar", "empaquetar_kit", "preparar", "validar_kit", "test_herramientas"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Las pruebas de cada complemento se ejecutan aparte, una carpeta por proceso (comprobar.py):
# juntas se pisan el idioma de Anki y los nombres de los tipos de nota.
testpaths = ["pruebas/herramientas"]
pythonpath = ["herramientas", "complementos"]
addopts = "--import-mode=importlib -p no:cacheprovider"
